<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose a new password · WILD WITHIN</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-panel"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Choose a new password.</h1>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}
<form method="post" class="auth-form"><label for="password">New password</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required><button class="button button-lime full" type="submit">Update password</button></form></section></main></body></html>
